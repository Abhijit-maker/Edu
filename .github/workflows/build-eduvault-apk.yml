name: Build Signed EduVault Android APK (eduvault.apk)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required by AGP 8.7.3 & Kotlin 2.1)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate V1+V2+V3 Release Signing Keystore (Play Protect Safe)
        working-directory: ./android
        run: |
          if [ ! -f app/eduvault-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/eduvault-release-key.jks \
              -alias eduvault_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass eduvault2026 \
              -keypass eduvault2026 \
              -dname "CN=EduVault WB Board, OU=EdTech, O=EduVault, L=Kolkata, ST=West Bengal, C=IN"
          fi

      - name: Build Signed Release APK (eduvault.apk)
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} ../eduvault.apk \;

      - name: Upload eduvault.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-apk
          path: eduvault.apk
          if-no-files-found: error
