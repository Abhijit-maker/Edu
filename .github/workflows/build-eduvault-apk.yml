name: Build Signed EduVault Android APK (eduvault.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required by AGP 8.7.3 & Kotlin 2.1)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate V1+V2+V3 Release Signing Keystore (Play Protect Safe)
        working-directory: ./android
        run: |
          if [ ! -f app/eduvault-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/eduvault-release-key.jks \
              -alias eduvault_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass eduvault2026 \
              -keypass eduvault2026 \
              -dname "CN=EduVault WB Board, OU=EdTech, O=EduVault, L=Kolkata, ST=West Bengal, C=IN"
          fi

      - name: Build Signed Release APK (eduvault.apk)
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../eduvault.apk

      - name: Upload eduvault.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduvault-signed-apk
          path: eduvault.apk
